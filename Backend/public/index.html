<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Tester</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f7fa;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header button {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .header button:hover { background: rgba(255,255,255,0.3); }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #667eea;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: #f0f2f5;
      color: #1c1e21;
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      align-self: flex-start;
      background: #fee;
      color: #c00;
      border: 1px solid #fcc;
    }
    .msg.system {
      align-self: center;
      background: #fff8dc;
      color: #666;
      font-size: 12px;
      font-style: italic;
    }
    .meta {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }
    .typing {
      align-self: flex-start;
      background: #f0f2f5;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      color: #999;
    }
    .typing span {
      animation: blink 1.4s infinite both;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: 0.2; } 30% { opacity: 1; } }
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid #e4e6eb;
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d0d4dc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .input-area input:focus { border-color: #667eea; }
    .input-area button {
      padding: 10px 20px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .input-area button:hover { background: #5568d3; }
    .input-area button:disabled { background: #aaa; cursor: not-allowed; }
    .quick-replies {
      padding: 0 20px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .quick-replies button {
      background: #f0f2f5;
      border: 1px solid #e4e6eb;
      color: #1c1e21;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
    }
    .quick-replies button:hover { background: #e4e6eb; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Chatbot Tester</h1>
      <button onclick="resetSession()">Reset</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="quick-replies" id="quickReplies"></div>
    <div class="input-area">
      <input
        id="input"
        type="text"
        placeholder="Nhập tin nhắn..."
        autocomplete="off"
        onkeydown="if(event.key==='Enter') sendMessage()"
      />
      <button id="sendBtn" onclick="sendMessage()">Gửi</button>
    </div>
  </div>

  <script>
    const API_URL = '/api/v1/ai/chat';
    let sessionId = 'test-' + Date.now();
    let isLoading = false;
    let conversationHistory = [];

    function addMessage(role, text, meta = null) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      if (meta) {
        const m = document.createElement('div');
        m.className = 'meta';
        m.textContent = meta;
        div.appendChild(m);
      }
      document.getElementById('messages').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    function addTyping() {
      const div = document.createElement('div');
      div.id = 'typing';
      div.className = 'typing';
      div.innerHTML = '<span>●</span><span>●</span><span>●</span>';
      document.getElementById('messages').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    function setQuickReplies(replies) {
      const container = document.getElementById('quickReplies');
      container.innerHTML = '';
      if (!replies || replies.length === 0) return;
      replies.forEach(r => {
        const btn = document.createElement('button');
        btn.textContent = r;
        btn.onclick = () => {
          document.getElementById('input').value = r;
          sendMessage();
        };
        container.appendChild(btn);
      });
    }

    function resetSession() {
      sessionId = 'test-' + Date.now();
      conversationHistory = [];
      document.getElementById('messages').innerHTML = '';
      document.getElementById('quickReplies').innerHTML = '';
      addMessage('system', 'Session đã reset. Hãy bắt đầu cuộc trò chuyện mới!');
    }

    async function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text || isLoading) return;

      input.value = '';
      isLoading = true;
      document.getElementById('sendBtn').disabled = true;
      setQuickReplies([]);

      addMessage('user', text);
      addTyping();

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: sessionId,
            channel: 'web',
            message: text,
            context: { conversation_history: conversationHistory },
          }),
        });

        removeTyping();

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          addMessage('error', `Lỗi ${res.status}: ${err.message || res.statusText}`);
          return;
        }

        const data = await res.json();
        const messages = data.messages || [];
        if (messages.length === 0) {
          addMessage('bot', '(Không có phản hồi)');
        } else {
          messages.forEach(m => addMessage('bot', m.content));
        }

        const meta = [
          `intent: ${data.intent?.name || '?'} (${(data.intent?.confidence || 0).toFixed(2)})`,
          `skill: ${data.skill?.name || '?'}`,
          `latency: ${data.metadata?.latency_ms || '?'}ms`,
        ].join(' | ');
        addMessage('system', meta);

        // Update history
        conversationHistory.push({ role: 'user', content: text });
        messages.forEach(m =>
          conversationHistory.push({ role: 'assistant', content: m.content })
        );

        if (data.metadata?.quick_replies) {
          setQuickReplies(data.metadata.quick_replies);
        }
      } catch (err) {
        removeTyping();
        addMessage('error', `Network error: ${err.message}`);
      } finally {
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      }
    }

    // Welcome
    addMessage('system', 'Xin chào! Hãy hỏi mình về học phí, ngành học, học bổng, tuyển sinh...');
    addMessage('system', `Session: ${sessionId}`);
  </script>
</body>
</html>
