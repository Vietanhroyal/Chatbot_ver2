services:
  chatbot-backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: chatbot-backend-container
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file:
      - ./.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      DB_HOST: ${DB_HOST:-rag-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-myuser}
      DB_PASSWORD: ${DB_PASSWORD:-mypassword}
      DB_NAME: ${DB_NAME:-rag_db}
      DATABASE_URL: ${DATABASE_URL:-postgresql://myuser:mypassword@rag-database:5432/rag_db}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      USE_DB_PROMPTS: ${USE_DB_PROMPTS:-false}
      USE_RAG_SEARCH: ${USE_RAG_SEARCH:-false}
      RAG_TOP_K: ${RAG_TOP_K:-5}
    depends_on:
      rag-database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  rag-database:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres-container
    ports:
      - "${DB_PUBLIC_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_NAME:-rag_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-myuser} -d ${DB_NAME:-rag_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
